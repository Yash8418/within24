name: Publish frontend

# Builds the React app and publishes it to GitHub Pages at /<repo>/.
# Needs: Settings -> Pages -> Source "GitHub Actions", and a repository variable
# API_URL pointing at the deployed API (e.g. https://within24-api.onrender.com).
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - name: Serve index.html for deep links (e.g. /within24/shifts)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
