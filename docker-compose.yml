# Local full stack: PostgreSQL + API. Run `docker compose up --build`, then the frontend with `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: within24
      POSTGRES_PASSWORD: within24
      POSTGRES_DB: within24
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U within24"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://within24:within24@db:5432/within24
      SECRET_KEY: local-development-only-change-me
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
